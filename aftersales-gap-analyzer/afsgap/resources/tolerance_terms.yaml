# Terms that mark a segment as "tolerance-related".
#
# Any input segment, research snippet, LLM output segment or report segment that
# matches one of these patterns is EXCLUDED from the whole pipeline:
#   - pre-LLM  : stripped from the current-process input and from search snippets
#   - in-prompt: the exclusion is restated as a hard rule in every prompt
#   - post-LLM : model output is re-scanned and offending segments are dropped
#   - final    : the rendered design document is scanned one last time
#
# Patterns are case-insensitive Python regular expressions.
# Edit this file to tune the exclusion - no code change required.

patterns:
  # --- direct tolerance vocabulary -----------------------------------------
  - '\btolerance[sd]?\b'
  - '\btoleranz\b'                      # German SAP documentation
  - '\btoleranzgrenze\w*\b'
  - '\btol\.?\s*limit[s]?\b'

  # --- over / under delivery and receipt -----------------------------------
  - '\bover[-\s]?deliver(?:y|ies|ed|ing)?\b'
  - '\bunder[-\s]?deliver(?:y|ies|ed|ing)?\b'
  - '\bover[-\s]?/?\s*under[-\s]?deliver\w*\b'
  - '\bover[-\s]?receipt[s]?\b'
  - '\bunder[-\s]?receipt[s]?\b'
  - '\bover[-\s]?issue[s]?\b'
  - '\bunlimited\s+over[-\s]?deliver\w*\b'

  # --- configuration objects that only exist to express a tolerance --------
  - '\btolerance\s+(?:key|group|limit|profile|check|band|range|category)\b'
  - '\b(?:quantity|qty|price|value|weight|date)\s+tolerance\b'
  - '\bo/?u\s*tolerance\b'
  - '\bduplicate\s+invoice\s+tolerance\b'

# Terms that look tolerance-ish but are legitimate aftersales vocabulary.
# A segment is only excluded if it matches a pattern above AND none of these
# allowances explain the match on their own.
allowances:
  - '\bzero[-\s]tolerance\s+(?:safety|policy)\b'   # HR/safety phrasing, not SAP tolerance
